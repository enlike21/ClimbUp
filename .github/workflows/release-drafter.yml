name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

# Writes the draft release; only reads pull request metadata. Runs on pushes to main only,
# never on pull requests, so contributors' code never gets this token.
permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-drafter
  cancel-in-progress: true

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v7.10.0
        with:
          config-name: release-drafter.yml
