name: Deploy to Plesk

on:
  push:
    branches: [main]

# The deploy only needs to read the repo; the server credentials come from secrets.
permissions:
  contents: read

# Never run two deploys on top of each other.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only runs where the deploy is configured: repository variable DEPLOY_PATH plus the
    # SERVER_HOST / SERVER_USER / SSH_PRIVATE_KEY secrets. Forks without them just skip it.
    if: vars.DEPLOY_PATH != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # Server-specific paths live in repository variables (Settings -> Secrets and
          # variables -> Actions -> Variables), so this file stays the same for every install.
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
          COMPOSER_PHAR: ${{ vars.COMPOSER_PHAR }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_PATH,PHP_BIN,COMPOSER_PHAR
          script: |
            set -e
            if [ -n "$COMPOSER_PHAR" ]; then COMPOSER_BIN="$PHP_BIN $COMPOSER_PHAR"; else COMPOSER_BIN=composer; fi
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            $COMPOSER_BIN install --no-dev --optimize-autoloader --no-interaction
            $PHP_BIN bin/console cache:clear --env=prod
            $PHP_BIN bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
