name: Informar de un error
description: Algo no funciona como debería.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por avisar. Si es un problema de **seguridad**, no lo publiques aquí: sigue SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: ¿Qué ha pasado?
      description: Describe el error y qué esperabas que pasara.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Ve a '...'
        2. Pulsa en '...'
        3. Aparece el error
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: ¿Dónde?
      description: URL o página (por ejemplo /juego, /map) y si es en climbup.es o en local.
  - type: input
    id: browser
    attributes:
      label: Navegador y dispositivo
      placeholder: Chrome 130 en Android, Safari en iPhone...
  - type: textarea
    id: extra
    attributes:
      label: Capturas o errores de consola
      description: Opcional. No pegues contraseñas ni datos personales.
